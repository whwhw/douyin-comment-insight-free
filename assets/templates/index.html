<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>对标账号洞察 · 洞察库</title>
<link rel="stylesheet" href="assets/ui/index.css"></head><body><div class="reading-progress" id="readingProgress" aria-hidden="true"></div><main class="shell"><header class="hero"><div><div class="eyebrow">BENCHMARK ACCOUNT INTELLIGENCE&nbsp; / &nbsp;洞察库</div><div class="hero-title"><span class="hero-title-icon" aria-hidden="true">AI</span><h1>对标账号洞察</h1></div><p>看清爆款、最新内容、评论需求与可测试的二创方向。</p></div><div class="sync"><i></i>索引已同步</div></header><section class="dashboard"><article class="panel stats"><div class="panel-title"><h2>数据统计</h2><span>当前洞察库</span></div><div class="metric-grid" id="metrics"></div><div class="run-note" id="runNote"></div></article><article class="panel"><div class="panel-title"><h2>赛道分布 Top 5</h2><span>按账号数量降序</span></div><div class="lane-empty">暂无已分类赛道数据</div></article><article class="panel conclusion"><span class="kicker">当前分析结论</span><h3>对标样本覆盖</h3><p id="conclusion"></p></article></section><section><div class="section-head"><h2>全部账号</h2><label class="search-wrap"><span hidden>搜索账号</span><input id="search" class="search" type="search" placeholder="搜索博主名称或抖音号"></label><span class="result" id="result"></span></div><div class="cards" id="cards"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script src="comment-insight-index-data.js"></script><script>
(()=>{'use strict';const d=window.COMMENT_INSIGHT_INDEX||{updatedAt:'',reports:[]},all=Array.isArray(d.reports)?d.reports:[],$=id=>document.getElementById(id),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>new Intl.NumberFormat('zh-CN').format(Number(v)||0),labels={completed:'已完成分析',pending:'数据准备中',failed:'分析失败'};function fallback(n){return `<div class="avatar-fallback">${safe(n).slice(0,1)||'洞'}</div>`}function card(a,i){const ready=Boolean(a.file),img=a.avatar?`<img class="avatar" src="${safe(a.avatar)}" alt="" loading="lazy">`:fallback(a.displayName);return `<article class="card" style="animation-delay:${Math.min(i*35,280)}ms"><div class="card-head">${img}<div class="identity"><div class="name-line"><h3 class="name" title="${safe(a.displayName)}">${safe(a.displayName)||'抖音名称未获取'}</h3><span class="name-fans">${fmt(a.followers)} <small>粉丝</small></span></div><span class="handle">@${safe(a.accountId)}</span><span class="lane">${safe(a.lane)||'未分类'}</span></div>${a.homepageUrl?`<a class="creator-home" href="${safe(a.homepageUrl)}" target="_blank" rel="noopener noreferrer" aria-label="打开${safe(a.displayName)}的抖音首页（新标签页）" title="打开博主首页"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M10 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>`:''}</div><p class="summary">${safe(a.summary)||'对标账号洞察'}</p><div class="card-foot"><a class="open${ready?'':' disabled'}" href="${ready?encodeURI(a.file):'#'}">查看报告</a></div></article>`}function render(){const q=$('search').value.trim().toLowerCase(),rows=all.filter(a=>!q||`${a.displayName||''} ${a.accountId||''}`.toLowerCase().includes(q));$('cards').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">没有匹配的账号</div>';$('result').textContent=`显示 ${rows.length} / ${all.length}`;document.querySelectorAll('.avatar').forEach(img=>img.addEventListener('error',()=>img.outerHTML=fallback(img.closest('.card').querySelector('.name').textContent),{once:true}))}const done=all.filter(a=>a.status==='completed'),comments=all.reduce((n,a)=>n+Number(a.commentCount||0),0),qualified=all.reduce((n,a)=>n+Number(a.qualifiedWorkCount||0),0);$('metrics').innerHTML=[['对标账号',all.length],['已完成',done.length],['完整转写',qualified],['评论证据',comments]].map(([l,v])=>`<div class="metric"><label>${l}</label><strong>${fmt(v)}</strong></div>`).join('');$('runNote').textContent=`最近更新：${safe(d.updatedAt)||'暂无'}`;$('conclusion').textContent=`已建立 ${all.length} 个对标账号档案，其中 ${qualified} 条作品通过完整口播证据校验。`;$('search').addEventListener('input',render);render()})();
</script><script src="assets/ui/index-insights.js"></script><script>
(()=>{const reports=window.COMMENT_INSIGHT_INDEX?.reports||[],byId=new Map(reports.map((item,index)=>[String(item.accountId),{...item,index}])),head=document.querySelector('.section-head'),search=document.getElementById('search'),cards=document.getElementById('cards'),menu=document.createElement('details');let mode='default';const choices=[['default','默认排序'],['followers-desc','粉丝量：从高到低'],['followers-asc','粉丝量：从低到高'],['time-desc','执行时间：从新到旧'],['time-asc','执行时间：从旧到新']];menu.className='sort-menu';menu.innerHTML=`<summary>默认排序</summary><div class="sort-options">${choices.map(([value,label],index)=>`<button class="sort-option${index?'':' active'}" data-value="${value}" type="button">${label}</button>`).join('')}</div>`;head.insertBefore(menu,document.getElementById('result'));const time=item=>Date.parse(item.executionAt||item.updatedAt||'')||0;function sortCards(){const nodes=[...cards.querySelectorAll('.card')];nodes.sort((a,b)=>{const aid=a.querySelector('.handle')?.textContent.replace(/^@/,'')||'',bid=b.querySelector('.handle')?.textContent.replace(/^@/,'')||'',x=byId.get(aid)||{},y=byId.get(bid)||{};if(mode==='followers-desc')return Number(y.followers||0)-Number(x.followers||0);if(mode==='followers-asc')return Number(x.followers||0)-Number(y.followers||0);if(mode==='time-desc')return time(y)-time(x);if(mode==='time-asc')return time(x)-time(y);return Number(x.index||0)-Number(y.index||0)});nodes.forEach(node=>cards.appendChild(node))}menu.addEventListener('click',event=>{const button=event.target.closest('.sort-option');if(!button)return;mode=button.dataset.value;menu.querySelector('summary').textContent=button.textContent;menu.querySelectorAll('.sort-option').forEach(item=>item.classList.toggle('active',item===button));menu.open=false;sortCards()});search.addEventListener('input',sortCards);document.addEventListener('click',event=>{if(!menu.contains(event.target))menu.open=false})})();
</script><script>
(()=>{
 const reduced=matchMedia('(prefers-reduced-motion:reduce)');
 if(window.gsap&&!reduced.matches){
  const intro=gsap.timeline({defaults:{ease:'power3.out',clearProps:'transform,opacity,visibility'}});
  intro.from('.hero',{opacity:0,y:12,duration:.65},0).from('.panel',{opacity:0,y:12,duration:.8,stagger:.1},.2).from('.section-head',{opacity:0,y:10,duration:.6},.4).from('.card',{opacity:0,y:14,duration:.7,stagger:{amount:.3}},.5);
 }
 let frame=0,target=null,x=0,y=0;
 document.querySelector('.shell').addEventListener('pointermove',e=>{
  if(reduced.matches||!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
  target=e.target.closest('.card,.panel');if(!target)return;
  const bounds=target.getBoundingClientRect();x=e.clientX-bounds.left;y=e.clientY-bounds.top;
  if(!frame)frame=requestAnimationFrame(()=>{frame=0;if(target){target.style.setProperty('--light-x',x+'px');target.style.setProperty('--light-y',y+'px')}});
 },{passive:true});
 addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;document.getElementById('readingProgress').style.transform='scaleX('+(max>0?scrollY/max:0)+')'},{passive:true});
})();
</script></body></html>
